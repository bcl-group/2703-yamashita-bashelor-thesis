<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>論文単語帳</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>論文単語帳</h1>
    <nav>
      <button class="tab active" data-tab="register">登録</button>
      <button class="tab" data-tab="list">一覧</button>
      <button class="tab" data-tab="quiz">クイズ</button>
    </nav>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <!-- 登録 -->
    <section id="tab-register" class="panel">
      <form id="lookup-form" autocomplete="off">
        <input id="word" type="text" placeholder="英単語を入力して Enter" spellcheck="false" autofocus>
      </form>
      <p id="lookup-note" class="note"></p>

      <div id="editor" hidden>
        <div class="editor-head">
          <h2 id="lemma"></h2>
          <span id="saved-badge" class="badge" hidden>登録済み</span>
        </div>

        <h3>保存内容</h3>
        <div id="senses"></div>
        <button type="button" id="add-sense" class="ghost">＋ 品詞を追加</button>

        <h3>例文</h3>
        <textarea id="example" rows="2" placeholder="論文中の一文を貼り付け（任意）"></textarea>

        <div class="actions">
          <button type="button" id="save" class="primary">保存 <kbd>Enter</kbd></button>
          <button type="button" id="delete" class="danger" hidden>削除</button>
          <span id="save-msg" class="msg"></span>
        </div>

        <div id="cand-wordnet" class="cands" hidden>
          <h3>WordNet の他の訳 <small>クリックで追加</small></h3>
          <div class="cand-body"></div>
        </div>
        <div id="cand-ejdict" class="cands" hidden>
          <h3>辞書の訳（品詞なし） <small>クリックして品詞を選ぶ</small></h3>
          <div class="cand-body"></div>
        </div>
      </div>
    </section>

    <!-- 一覧 -->
    <section id="tab-list" class="panel" hidden>
      <div class="filters">
        <input id="q" type="search" placeholder="単語・訳で検索">
        <select id="filter-pos"><option value="">すべての品詞</option></select>
        <select id="sort">
          <option value="new">新しい順</option>
          <option value="alpha">アルファベット順</option>
        </select>
      </div>
      <p id="list-count" class="note"></p>
      <ul id="word-list" class="word-list"></ul>
    </section>

    <!-- クイズ -->
    <section id="tab-quiz" class="panel" hidden>
      <div id="quiz-card" class="quiz-card">
        <p id="quiz-word" class="quiz-word"></p>
        <div id="quiz-answer" hidden></div>
        <p id="quiz-hint" class="note">クリックまたは Space で答えを表示</p>
      </div>
      <div id="quiz-buttons" class="actions center" hidden>
        <button type="button" id="quiz-wrong" class="danger">まだ <kbd>←</kbd></button>
        <button type="button" id="quiz-correct" class="primary">覚えた <kbd>→</kbd></button>
      </div>
      <p id="quiz-stats" class="note center"></p>
    </section>
  </main>

  <div id="pos-menu" class="pos-menu" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
